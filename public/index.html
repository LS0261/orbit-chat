<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit Chat</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --chat-bg: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Header */
        header { background: var(--chat-bg); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .profile-info { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .profile-info img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); }
        .profile-info h3 { font-size: 1rem; color: var(--text-main); }
        .profile-info span { font-size: 0.8rem; color: var(--text-muted); }

        /* Chat Container */
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth; }
        
        /* Mensajes */
        .message-row { display: flex; align-items: flex-end; gap: 10px; max-width: 75%; }
        .message-row.mine { margin-left: auto; flex-direction: row-reverse; }
        .message-row img.avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        .message-row.grouped img.avatar { visibility: hidden; } /* Oculta pfp si es mensaje seguidos */
        
        .bubble { background: var(--chat-bg); padding: 10px 14px; border-radius: 14px; position: relative; word-break: break-word; border: 1px solid var(--border); }
        .message-row.mine .bubble { background: var(--accent); border: none; }
        .message-row.grouped { margin-top: -4px; } /* Agrupa más pegado */

        .bubble .username { font-size: 0.75rem; color: var(--accent); font-weight: bold; margin-bottom: 2px; display: block; }
        .message-row.mine .bubble .username { display: none; }
        .bubble .text { font-size: 0.95rem; }
        .bubble .time { font-size: 0.65rem; color: var(--text-muted); float: right; margin-left: 8px; margin-top: 4px; }
        .message-row.mine .bubble .time { color: rgba(255,255,255,0.7); }
        
        .bubble img, .bubble video { max-width: 220px; border-radius: 8px; margin-top: 6px; display: block; }

        /* Input area */
        .input-area { background: var(--chat-bg); padding: 12px 20px; display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--border); }
        .input-area input[type="text"] { flex: 1; background: var(--bg-color); border: 1px solid var(--border); padding: 10px 14px; border-radius: 20px; color: var(--text-main); outline: none; }
        .input-area button, .media-btn { background: var(--accent); color: white; border: none; padding: 10px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .input-area button:hover { background: var(--accent-hover); }
        
        /* Modal de Perfil y Galería Interna */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--chat-bg); padding: 24px; border-radius: 16px; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; border: 1px solid var(--border); }
        .modal-content h2 { font-size: 1.2rem; }
        .modal-content input, .modal-content textarea { width: 100%; background: var(--bg-color); border: 1px solid var(--border); padding: 10px; border-radius: 8px; color: var(--text-main); }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; }
        
        /* Selector de galería interna */
        #media-preview-container { display: none; padding: 10px; background: rgba(0,0,0,0.2); border-top: 1px solid var(--border); align-items: center; gap: 10px; }
        #media-preview-container img, #media-preview-container video { height: 60px; border-radius: 6px; }
    </style>
</head>
<body>

    <!-- Header / Perfil -->
    <header>
        <div class="profile-info" onclick="openProfileModal()">
            <img id="header-pfp" src="https://i.imgur.com/6VBx3io.png" alt="PFP">
            <div>
                <h3 id="header-username">Invitado</h3>
                <span id="header-status">En línea</span>
            </div>
        </div>
        <div>
            <button class="media-btn" onclick="requestNotificationPermission()">🔔 Notificaciones</button>
        </div>
    </header>

    <!-- Contenedor del Chat con Scroll -->
    <div id="chat-container"></div>

    <!-- Previsualizador de archivos multimedia internos -->
    <div id="media-preview-container">
        <div id="preview-element-container"></div>
        <span id="file-name-label" style="font-size: 0.85rem; color: var(--text-muted); flex: 1;"></span>
        <button onclick="clearMedia()" style="background: #ef4444; padding: 5px 10px; border-radius: 5px; border:none; color:white; cursor:pointer;">X</button>
    </div>

    <!-- Barra de Entrada -->
    <div class="input-area">
        <!-- Selector Interno de Fotos/Vídeos (Muestra galería dentro de la app) -->
        <input type="file" id="internal-media-input" accept="image/*,video/*" style="display: none;" onchange="handleMediaSelection(event)">
        <button class="media-btn" onclick="document.getElementById('internal-media-input').click()" title="Enviar Imagen/Video">🖼️</button>
        
        <!-- Selector de archivos generales del sistema -->
        <input type="file" id="system-file-input" style="display: none;" onchange="handleSystemFile(event)">
        <button class="media-btn" onclick="document.getElementById('system-file-input').click()" title="Enviar Archivo General">📁</button>

        <input type="text" id="message-input" placeholder="Escribe un mensaje..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button onclick="sendMessage()">Enviar</button>
    </div>

    <!-- Modal de Edición de Perfil -->
    <div id="profile-modal" class="modal">
        <div class="modal-content">
            <h2>Editar Perfil</h2>
            <label>Nombre de usuario:</label>
            <input type="text" id="input-username" placeholder="Tu nombre">
            
            <label>Estado:</label>
            <input type="text" id="input-status" placeholder="Ej. Programando un juego">
            
            <label>Foto de Perfil (Imagen):</label>
            <input type="file" id="input-pfp-file" accept="image/*" onchange="previewProfilePic(event)">
            <div style="text-align: center;">
                <img id="modal-pfp-preview" src="https://i.imgur.com/6VBx3io.png" style="width: 70px; height: 70px; border-radius: 50%; object-fit: cover; margin-top: 5px; border: 2px solid var(--accent);">
            </div>

            <div class="modal-buttons">
                <button onclick="closeProfileModal()" style="background: transparent; border: 1px solid var(--border); color: var(--text-main);">Cancelar</button>
                <button onclick="saveProfile()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();

        // Estado del usuario local
        let user = {
            username: localStorage.getItem('chat_username') || 'Usuario_' + Math.floor(Math.random() * 1000),
            status: localStorage.getItem('chat_status') || 'Disponible',
            pfp: localStorage.getItem('chat_pfp') || 'https://i.imgur.com/6VBx3io.png'
        }

        let selectedMediaData = { data: null, type: null, name: '' };
        let lastSenderId = null; // Para control de mensajes agrupados

        // Inicializar UI con datos guardados
        document.getElementById('header-username').innerText = user.username;
        document.getElementById('header-status').innerText = user.status;
        document.getElementById('header-pfp').src = user.pfp;
        document.getElementById('input-username').value = user.username;
        document.getElementById('input-status').value = user.status;
        document.getElementById('modal-pfp-preview').src = user.pfp;

        // Gestión de Notificaciones
        function requestNotificationPermission() {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        alert("¡Notificaciones activadas con éxito!");
                    }
                });
            }
        }

        function triggerNotification(sender, text) {
            if (document.hidden && Notification.permission === "granted") {
                new Notification(`Nuevo mensaje de ${sender}`, {
                    body: text || "Te ha enviado un archivo multimedia.",
                    icon: user.pfp
                });
            }
        }

        // Modal de Perfil
        function openProfileModal() { document.getElementById('profile-modal').style.display = 'flex'; }
        function closeProfileModal() { document.getElementById('profile-modal').style.display = 'none'; }

        function previewProfilePic(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('modal-pfp-preview').src = e.target.result;
                    window.tempPfpBase64 = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function saveProfile() {
            user.username = document.getElementById('input-username').value || 'Anónimo';
            user.status = document.getElementById('input-status').value || 'En línea';
            if (window.tempPfpBase64) {
                user.pfp = window.tempPfpBase64;
            }

            localStorage.setItem('chat_username', user.username);
            localStorage.setItem('chat_status', user.status);
            localStorage.setItem('chat_pfp', user.pfp);

            document.getElementById('header-username').innerText = user.username;
            document.getElementById('header-status').innerText = user.status;
            document.getElementById('header-pfp').src = user.pfp;

            closeProfileModal();
        }

        // Selección multimedia interna (Muestra previsualización dentro de la app)
        function handleMediaSelection(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                selectedMediaData.data = e.target.result;
                selectedMediaData.type = file.type.startsWith('image') ? 'image' : 'video';
                selectedMediaData.name = file.name;

                const container = document.getElementById('preview-element-container');
                container.innerHTML = selectedMediaData.type === 'image' 
                    ? `<img src="${e.target.result}">` 
                    : `<video src="${e.target.result}"></video>`;
                
                document.getElementById('file-name-label').innerText = file.name;
                document.getElementById('media-preview-container').style.display = 'flex';
            }
            reader.readAsDataURL(file);
        }

        function handleSystemFile(event) {
            // Manejo alternativo si deseas enviar un archivo general del sistema como documento
            handleMediaSelection(event);
        }

        function clearMedia() {
            selectedMediaData = { data: null, type: null, name: '' };
            document.getElementById('media-preview-container').style.display = 'none';
            document.getElementById('internal-media-input').value = '';
            document.getElementById('system-file-input').value = '';
        }

        // Enviar Mensaje
        function sendMessage() {
            const textInput = document.getElementById('message-input');
            const text = textInput.value.trim();

            if (!text && !selectedMediaData.data) return;

            socket.emit('chat_message', {
                username: user.username,
                pfp: user.pfp,
                text: text,
                media: selectedMediaData.data,
                mediaType: selectedMediaData.type
            });

            textInput.value = '';
            clearMedia();
        }

        // Recibir Mensaje
        socket.on('chat_message', (data) => {
            const chatContainer = document.getElementById('chat-container');
            const isMine = data.id === socket.id;

            // Agrupación de mensajes seguidos (si es el mismo usuario que el anterior)
            const isGrouped = (lastSenderId === data.username);
            lastSenderId = data.username;

            const row = document.createElement('div');
            row.className = `message-row ${isMine ? 'mine' : ''} ${isGrouped ? 'grouped' : ''}`;

            let mediaHTML = '';
            if (data.media) {
                if (data.mediaType === 'image') {
                    mediaHTML = `<img src="${data.media}" alt="Media">`;
                } else {
                    mediaHTML = `<video src="${data.media}" controls></video>`;
                }
            }

            row.innerHTML = `
                <img class="avatar" src="${data.pfp}" alt="Avatar">
                <div class="bubble">
                    <span class="username">${data.username}</span>
                    <div class="text">${data.text}</div>
                    ${mediaHTML}
                    <span class="time">${data.timestamp}</span>
                </div>
            `;

            chatContainer.appendChild(row);
            
            // Auto-scroll hacia abajo
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Disparar notificación si no es nuestro propio mensaje
            if (!isMine) {
                triggerNotification(data.username, data.text);
            }
        });
    </script>
</body>
</html>
